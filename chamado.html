</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#16283D"/><text x="50" y="62" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">CI</text></svg></template>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="Atendimentos.jsx"></script>
<script type="text/babel">
const LS_KEY = "portalci-dados-v2";
const lerLocal = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } };
const gravarLocal = (fn) => { const d = lerLocal(); const out = fn({ ...d, chamados: d.chamados || [] }); localStorage.setItem(LS_KEY, JSON.stringify(out)); };

async function buscarChamado(token) {
  if (window.sb) {
    const { data, error } = await window.sb.rpc("chamado_publico", { p_token: token });
    if (error) throw error;
    return data || null;
  }
  const c = (lerLocal().chamados || []).find((x) => x.token === token || x.id === token);
  return c ? { ...c, atividades: c.acompanhamento && c.acompanhamento.length ? c.acompanhamento : c.atividades } : null;
}
async function criarChamado(f) {
  const P = window.PortalUI;
  if (window.sb) {
    const { data, error } = await window.sb.rpc("abrir_chamado", { p: f });
    if (error) throw error;
    return data;
  }
  const c = { ...f, id: "", token: P.novoToken(), prazo: "", status: "Novo", criadoEm: P.agora(), criadoTs: Date.now(), criadoPor: "Formulário público", atividades: [], log: [] };
  {
    let n = 0;
    gravarLocal((d) => { n = (d.chamados || []).reduce((m, x) => { const k = /^AT(\d+)/.exec(String(x.id)); return k ? Math.max(m, parseInt(k[1], 10)) : m; }, 0) + 1; c.id = "AT" + String(n).padStart(4, "0") + "-" + Array.from(crypto.getRandomValues(new Uint8Array(2)), (b) => b.toString(16).padStart(2, "0")).join(""); return { ...d, chamados: [c, ...d.chamados] }; });
  }
  return c;
}
async function avaliar(token, nota, comentario) {
  if (window.sb) { await window.sb.rpc("avaliar_chamado", { p_token: token, p_nota: nota, p_comentario: comentario }); return; }
  gravarLocal((d) => ({ ...d, chamados: d.chamados.map((c) => (c.token === token ? { ...c, npsScore: nota, npsComentario: comentario } : c)) }));
}

function Shell({ children, sub }) {
  return (
    <div>
      <header style={{ background: "var(--surface-header)", color: "#fff", borderBottom: "3px solid var(--orange)" }}>
        <div style={{ maxWidth: 760, margin: "0 auto", padding: "12px 20px", display: "flex", alignItems: "center", gap: 14 }}>
          <img src="./assets/logo-branca.png" alt="Grupo Águia Branca" style={{ height: 34 }} />
          <div style={{ fontSize: 14, color: "#E4EDF7" }}>Comunicação Interna · {sub}</div>
        </div>
      </header>
      <main style={{ maxWidth: 760, margin: "0 auto", padding: "26px 20px 40px" }}>{children}</main>
    </div>
  );
}

function Formulario() {
  const { Card, Field, Input, Select, Button } = window.PortalCIGABComRcioDesignSystem_6ad0f7;
  const P = window.PortalUI;
  const [f, setF] = React.useState({ solicitante: "", area: "", whatsapp: "", tipo: P.TIPOS_ATENDIMENTO[0], assunto: "", descricao: "", link: "", urgencia: "Média" });
  const [enviando, setEnviando] = React.useState(false);
  const [erro, setErro] = React.useState("");
  const [criado, setCriado] = React.useState(null);
  const [copiado, setCopiado] = React.useState(false);
  const set = (k, v) => setF({ ...f, [k]: v });
  const ok = f.solicitante && f.whatsapp && f.area.trim() && f.assunto && f.descricao;
  const enviar = async () => { if (!ok || enviando) return; setEnviando(true); setErro(""); try { setCriado(await criarChamado(f)); } catch (e) { setErro(e && /Muitos|longo|Preencha/.test(e.message || "") ? e.message : "Não foi possível enviar agora. Tente novamente em instantes."); } setEnviando(false); };
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  if (criado) {
    const link = location.href.split("?")[0] + "?c=" + criado.token;
    return (
      <Card style={{ padding: 26, textAlign: "center" }}>
        <div style={{ fontSize: 40, color: "var(--success)" }}>✓</div>
        <h1 style={{ fontSize: 21, margin: "6px 0" }}>Chamado {criado.id} registrado</h1>
        <p style={{ color: "var(--slate)", fontSize: 14, lineHeight: 1.6, maxWidth: 480, margin: "0 auto 18px" }}>A equipe de Comunicação Interna vai analisar seu pedido e entrar em contato pelo WhatsApp informado, com a previsão de entrega.</p>
        <div style={{ fontSize: 12, fontWeight: 700, color: "var(--slate)", marginBottom: 6 }}>Guarde este link para acompanhar seu chamado:</div>
        <div style={{ display: "flex", gap: 8, maxWidth: 520, margin: "0 auto" }}>
          <input readOnly value={link} style={{ ...P.inputBase, fontSize: 12 }} />
          <Button variant="ghost" onClick={() => { navigator.clipboard && navigator.clipboard.writeText(link); setCopiado(true); }}>{copiado ? "Copiado" : "Copiar"}</Button>
        </div>
        <div style={{ marginTop: 16 }}><a href={link} style={{ fontWeight: 700 }}>Abrir acompanhamento →</a></div>
      </Card>
    );
  }
  return (
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 800, margin: "0 0 4px" }}>Abrir chamado para a Comunicação Interna</h1>
      <p style={{ color: "var(--slate)", fontSize: 14, margin: "0 0 18px" }}>Peça vídeos, artes, comunicados e apoio em eventos. Veja como funciona:</p>
      <window.GuiaChamado />
      <Card style={{ padding: 22 }}>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 220px" }}><Field label="Seu nome"><Input value={f.solicitante} maxLength={120} onChange={(e) => set("solicitante", e.target.value)} /></Field></div>
          <div style={{ flex: "1 1 220px" }}><Field label="Seu WhatsApp"><Input value={f.whatsapp} maxLength={30} inputMode="tel" onChange={(e) => set("whatsapp", e.target.value)} placeholder="(27) 99999-9999" /></Field></div>
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 220px" }}><Field label="Sua área / empresa"><Input value={f.area} maxLength={120} onChange={(e) => set("area", e.target.value)} placeholder="ex.: RH Kurumá, Vendas Vitória Motors" /></Field></div>
          <div style={{ flex: "1 1 220px" }}><Field label="Tipo de pedido"><Select value={f.tipo} onChange={(e) => set("tipo", e.target.value)}>{P.TIPOS_ATENDIMENTO.map((t) => <option key={t}>{t}</option>)}</Select></Field></div>
        </div>
        <Field label="Assunto"><Input value={f.assunto} maxLength={200} onChange={(e) => set("assunto", e.target.value)} placeholder="ex.: Vídeo para a convenção de vendas" /></Field>
        <Field label="O que você precisa?"><textarea value={f.descricao} maxLength={5000} onChange={(e) => set("descricao", e.target.value)} style={{ ...P.inputBase, minHeight: 110, resize: "vertical", fontSize: 14 }} placeholder="Descreva o pedido: para quem é, onde será usado, se já existe algum material..." /></Field>
        <Field label="Link (opcional)"><Input type="url" value={f.link} maxLength={500} onChange={(e) => set("link", e.target.value)} placeholder="https://... (pasta, arquivo, referência)" /></Field>
        <div style={{ fontSize: 12, fontWeight: 700, color: "var(--slate)", marginBottom: 6 }}>Qual o nível de urgência?</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 8, marginBottom: 18 }}>
          {P.URGENCIAS.map(([u, d]) => (
            <button key={u} onClick={() => set("urgencia", u)} style={{ textAlign: "left", padding: "10px 12px", borderRadius: 8, border: `2px solid ${f.urgencia === u ? P.URG_COLOR[u] : "var(--line)"}`, background: f.urgencia === u ? "var(--canvas)" : "#fff", cursor: "pointer", fontFamily: "var(--font-sans)" }}>
              <div style={{ fontWeight: 800, fontSize: 13, color: P.URG_COLOR[u] }}>{u}</div><div style={{ fontSize: 11, color: "var(--slate)", marginTop: 2 }}>{d}</div>
            </button>
          ))}
        </div>
        <div style={{ fontSize: 12, color: "var(--slate)", marginBottom: 14 }}>O prazo de entrega é definido pela equipe depois da análise e informado a você pelo WhatsApp.</div>
        {erro && <div style={{ color: "var(--danger)", fontSize: 13, marginBottom: 10, fontWeight: 600 }}>{erro}</div>}
        <Button variant="primary" onClick={enviar} style={{ width: "100%", justifyContent: "center", opacity: ok && !enviando ? 1 : .5 }}>{enviando ? "Enviando..." : "Enviar chamado"}</Button>
      </Card>
    </div>
  );
}

function Acompanhamento({ token }) {
  const { Card, Button, StatusBadge } = window.PortalCIGABComRcioDesignSystem_6ad0f7;
  const P = window.PortalUI;
  const [c, setC] = React.useState(undefined);
  const [nota, setNota] = React.useState(null);
  const [coment, setComent] = React.useState("");
  const [enviado, setEnviado] = React.useState(false);
  const load = () => buscarChamado(token).then(setC).catch(() => setC((v) => (v === undefined ? null : v)));
  React.useEffect(() => { load(); const t = setInterval(load, 30000); return () => clearInterval(t); }, []);
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  if (c === undefined) return <div style={{ color: "var(--slate)" }}>Carregando...</div>;
  if (!c) return <Card style={{ padding: 26, textAlign: "center" }}><b>Chamado não encontrado.</b><div style={{ color: "var(--slate)", fontSize: 13, marginTop: 6 }}>Confira se o link está completo ou fale com a Comunicação Interna.</div></Card>;
  const etapas = ["Novo", "Em atendimento", "Concluído"];
  const idx = c.status === "Aguardando solicitante" ? 1 : Math.max(etapas.indexOf(c.status), 0);
  const label = { Novo: "Recebido", "Em atendimento": "Em atendimento", "Concluído": "Concluído" };
  return (
    <div>
      <div style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, fontFamily: "monospace" }}>{c.id}</div>
      <h1 style={{ fontSize: 23, fontWeight: 800, margin: "2px 0 16px" }}>{c.assunto}</h1>
      <Card style={{ padding: 20, marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 0 }}>
          {etapas.map((e, i) => (
            <React.Fragment key={e}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, minWidth: 90 }}>
                <div style={{ width: 28, height: 28, borderRadius: 14, background: i <= idx ? (c.status === "Cancelado" ? "var(--slate)" : "var(--success)") : "var(--line)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 13 }}>{i <= idx ? "✓" : i + 1}</div>
                <div style={{ fontSize: 12, fontWeight: i === idx ? 800 : 600, color: i <= idx ? "var(--ink)" : "var(--muted)" }}>{label[e]}</div>
              </div>
              {i < etapas.length - 1 && <div style={{ flex: 1, height: 3, background: i < idx ? "var(--success)" : "var(--line)", borderRadius: 2, marginBottom: 20 }} />}
            </React.Fragment>
          ))}
        </div>
        {c.status === "Aguardando solicitante" && <div style={{ marginTop: 14, background: "var(--soft-orange)", borderRadius: 8, padding: 10, fontSize: 13, fontWeight: 600 }}>A equipe está aguardando uma informação sua. Fique de olho no WhatsApp.</div>}
        <div style={{ display: "flex", gap: 24, marginTop: 18, flexWrap: "wrap", fontSize: 13 }}>
          <div><div style={{ fontSize: 11, color: "var(--muted)", fontWeight: 700 }}>ABERTO EM</div><b>{c.criadoEm || "—"}</b></div>
          <div><div style={{ fontSize: 11, color: "var(--muted)", fontWeight: 700 }}>PREVISÃO DE ENTREGA</div><b>{c.prazo ? P.fmtY(c.prazo) : "em análise"}</b></div>
          <div><div style={{ fontSize: 11, color: "var(--muted)", fontWeight: 700 }}>URGÊNCIA INFORMADA</div><b>{c.urgencia || "—"}</b></div>
        </div>
      </Card>
      <Card style={{ padding: 20, marginBottom: 14 }}>
        <div style={{ fontSize: 11, fontWeight: 800, color: "var(--blue-dark)", textTransform: "uppercase", letterSpacing: ".4px", marginBottom: 8 }}>Seu pedido</div>
        <div style={{ fontSize: 14.5, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{c.descricao}</div>
      </Card>
      <Card style={{ padding: 20, marginBottom: 14 }}>
        <div style={{ fontSize: 11, fontWeight: 800, color: "var(--blue-dark)", textTransform: "uppercase", letterSpacing: ".4px", marginBottom: 8 }}>O que está sendo feito</div>
        {(c.atividades || []).length === 0 && <div style={{ fontSize: 13, color: "var(--slate)" }}>A equipe ainda está analisando seu pedido.</div>}
        {(c.atividades || []).map((a, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 0", borderTop: i ? "1px solid var(--line)" : "none", fontSize: 13.5 }}>
            <div style={{ flex: 1, fontWeight: 600 }}>{a.nome}</div>
            <div style={{ fontSize: 12, color: "var(--slate)" }}>{P.fmtPeriodo(a.s, a.e)}</div>
            <StatusBadge status={a.status} />
          </div>
        ))}
      </Card>
      {c.status === "Concluído" && (
        <Card style={{ padding: 20 }}>
          {c.npsScore != null || enviado ? <div style={{ textAlign: "center", fontWeight: 700 }}>Obrigado pela avaliação!</div> : (
            <>
              <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>Como foi o atendimento?</div>
              <div style={{ fontSize: 12.5, color: "var(--slate)", marginBottom: 12 }}>De 0 a 10, quanto você recomendaria a Comunicação Interna?</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(11,minmax(0,1fr))", gap: 4, marginBottom: 12 }}>
                {Array.from({ length: 11 }, (_, n) => <button key={n} onClick={() => setNota(n)} style={{ padding: "9px 0", borderRadius: 6, border: `1px solid ${nota === n ? "var(--blue-dark)" : "var(--line)"}`, background: nota === n ? "var(--blue-dark)" : "#fff", color: nota === n ? "#fff" : "var(--ink)", fontWeight: 700, cursor: "pointer", fontFamily: "var(--font-sans)" }}>{n}</button>)}
              </div>
              <textarea value={coment} maxLength={1000} onChange={(e) => setComent(e.target.value)} placeholder="Comentário (opcional)" style={{ ...P.inputBase, minHeight: 60, marginBottom: 10 }} />
              <Button variant="primary" onClick={async () => { if (nota == null) return; await avaliar(token, nota, coment); setEnviado(true); }} style={{ opacity: nota == null ? .5 : 1 }}>Enviar avaliação</Button>
            </>
          )}
        </Card>
      )}
      <div style={{ textAlign: "center", marginTop: 18, fontSize: 12, color: "var(--muted)" }}>Esta página se atualiza sozinha. <a href={location.href.split("?")[0]}>Abrir outro chamado</a></div>
    </div>
  );
}

function PaginaChamado() {
  const token = new URLSearchParams(location.search).get("c");
  return <Shell sub={token ? "Acompanhar chamado" : "Abrir chamado"}>{token ? <Acompanhamento token={token} /> : <Formulario />}</Shell>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<PaginaChamado />);
</script>
</body>
</html>
