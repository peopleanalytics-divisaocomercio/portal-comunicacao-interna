<style id="mobile-css">
html{-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top)}
@media (max-width:760px){
header>div{padding:8px 12px !important;gap:6px 8px !important}
header img{height:28px !important}
header>div>div:first-child>div{display:none !important}
header{border-bottom-width:2px !important}
header nav{position:fixed !important;left:0;right:0;bottom:0;z-index:50;background:var(--surface-header);border-top:2px solid var(--orange);flex-wrap:nowrap !important;overflow-x:auto;justify-content:space-between !important;gap:0 !important;padding:4px 4px calc(4px + env(safe-area-inset-bottom)) !important;margin:0 !important;-webkit-overflow-scrolling:touch;scrollbar-width:none;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
header nav::-webkit-scrollbar{display:none}
header nav button{flex:1 0 64px !important;flex-direction:column !important;gap:3px !important;padding:7px 4px 6px !important;font-size:10px !important;line-height:1.1;border-radius:10px !important;background:transparent !important;color:#C7D8EA !important;white-space:normal !important;text-align:center;min-height:52px;justify-content:center}
header nav button svg{width:21px !important;height:21px !important}
header nav button[style*="font-weight: 700"]{color:#fff !important;background:rgba(247,148,29,.22) !important}
header nav button[style*="font-weight: 700"] svg{color:var(--orange)}
body div.no-print[style*="position: fixed"][style*="right: 16px"]{bottom:calc(76px + env(safe-area-inset-bottom)) !important}
header>div>div:last-child{margin-left:auto;border-left:0 !important;padding-left:0 !important}
header>div>div:last-child>div:first-child{display:none !important}
main [style*="display: flex"]:has(> button),main [style*="display: flex"]:has(> a){flex-wrap:wrap}
main [style*="min-width: 150px"]{min-width:calc(50% - 7px) !important;flex:1 1 calc(50% - 7px) !important;padding:12px !important}
main [style*="min-width: 150px"] [style*="font-size: 3"],main [style*="min-width: 150px"] [style*="font-size: 2"]{font-size:22px !important}
main [style*="display: flex"]:has(> [style*="min-width: 150px"]){gap:10px !important}
main{padding:12px !important;padding-bottom:calc(96px + env(safe-area-inset-bottom)) !important}
main h1{font-size:19px !important}
main [style*="grid-template-columns"]:not([style*="repeat(7"]):not([style*="repeat(4"]){grid-template-columns:minmax(0,1fr) !important}
main [style*="repeat(4"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
main input,main select,main textarea{max-width:100%;font-size:16px !important}
main select[style*="width"],main input[style*="width"]:not([type="checkbox"]):not([type="radio"]){min-width:0}
main div:has(> table){overflow-x:auto;-webkit-overflow-scrolling:touch}
main td,main th{padding-left:8px !important;padding-right:8px !important}
main [style*="display: flex"][style*="space-between"]{flex-wrap:wrap}
div[style*="position: fixed"][style*="inset: 0"]{padding:0 !important;align-items:flex-end !important}
div[style*="position: fixed"][style*="inset: 0"]>div{width:100% !important;max-width:100% !important;max-height:94vh !important;border-radius:16px 16px 0 0 !important;padding:18px 16px calc(18px + env(safe-area-inset-bottom)) !important}
div[style*="position: fixed"][style*="inset: 0"] input,div[style*="position: fixed"][style*="inset: 0"] select,div[style*="position: fixed"][style*="inset: 0"] textarea{font-size:16px !important}
div[style*="position: fixed"][style*="inset: 0"] [style*="grid-template-columns"]:not([style*="repeat(4"]){grid-template-columns:minmax(0,1fr) !important}
div[style*="position: fixed"][style*="inset: 0"] [style*="display: flex"]{flex-wrap:wrap}
}
